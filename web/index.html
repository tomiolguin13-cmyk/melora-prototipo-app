<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melora · Aprendé guitarra a tu manera</title>
<meta name="theme-color" content="#743c8c">
<link rel="icon" href="../icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f6f4f4}
a{color:#ffffff}a:hover{color:#efe3f7}
.hero{position:relative;aspect-ratio:727/305;min-height:600px;overflow:hidden;background:#3fb4ec}
.mundos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-gtr{position:absolute;left:31%;top:2%;height:118%;width:auto;pointer-events:none}
.hero-txt{position:absolute;left:4.6%;top:48%;transform:translateY(-50%);width:36%;display:flex;flex-direction:column;gap:1.6vw}
.mundo{display:flex;gap:80px;align-items:center;max-width:1280px;margin:0 auto}
.mundo.inv{flex-direction:row-reverse}
.mundo-img{flex:0 0 480px;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center}
.mundo-txt{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:14px}
@keyframes flotar{0%,100%{translate:0 0}50%{translate:0 -12px}}
.flota{animation:flotar 4.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.flota{animation:none}}
.h1{margin:0;font-size:clamp(34px,5.4vw,84px);line-height:1;font-weight:700;color:#1d1e1c}
.isla-card{position:absolute;width:11.6%;min-width:150px;background:#ffffff;border-radius:14px;padding:10px 12px;box-sizing:border-box;box-shadow:0 3px 0 rgba(7,49,84,.15)}
.pasos-mob{display:none}
@keyframes boing0{0%,100%{scale:1}42%{scale:1.04}}
@keyframes boing1{0%,100%{scale:1}42%{scale:1.04}}
@keyframes boingc0{0%,100%{scale:1}42%{scale:1.06}}
@keyframes boingc1{0%,100%{scale:1}42%{scale:1.06}}
.navlinks a{display:inline-block}
@media (prefers-reduced-motion:reduce){.btn3d,.tile{animation:none !important}}
.tile{transition:transform .08s}
.tile:hover{transform:translateY(-2px)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.leccion{display:flex;flex-wrap:wrap;gap:40px;align-items:center}
.navlinks{display:flex;gap:44px}
@media (max-width:900px){
.hero{aspect-ratio:auto;background:#f6f4f4}
.hero-bg{position:static;display:block;width:100%;height:280px;object-fit:cover;object-position:88% 50%}
.hero-txt{position:static;transform:none;width:auto;padding:32px 20px 28px;gap:16px}
.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.mundos{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.hero{min-height:0}
.navlinks{display:none}
.mundo,.mundo.inv{flex-direction:column;gap:28px}
.mundo-img{flex:none;width:min(320px,80vw)}
}
</style>

</head>

<div style="font-family: Fredoka, system-ui, sans-serif; color: #1d1e1c; background: #f6f4f4; min-height: 100vh">

          <text x="314.96" y="373.81" fill="#ffffff" style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 179px">elora</text>
        </svg>
      </a>
      <div class="navlinks" style="font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 16px">
        <a href="#inicio" onClick="{{irInicioNav}}" style="{{navInicio}}; {{bNavI}}">Inicio</a>
        <a href="#como-funciona" style="text-decoration: none; padding-bottom: 4px">Cómo funciona</a>
        <a href="#mundos" onClick="{{irMundosNav}}" style="{{navMundos}}; {{bNavM}}">Mundos</a>
        <a href="#comunidad" style="text-decoration: none; padding-bottom: 4px">Comunidad</a>
        <a href="#padres" style="text-decoration: none; padding-bottom: 4px">Para padres</a>
      </div>
    </div>
    <a href="#login" style="text-decoration: none; font-weight: 600; font-size: 16px; color: #743c8c; background: #ffffff; border-radius: 999px; padding: 9px 26px">Iniciar sesión</a>
  </nav>

  <sc-if value="{{enInicio}}" hint-placeholder-val="{{ true }}">
    <div>
      <section id="inicio" class="hero">
        <img class="hero-bg" src="img/hero3.webp" alt="">
        <div class="hero-txt">
          <p style="margin: 0; font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: clamp(14px, 1.3vw, 20px); letter-spacing: 0.02em; color: #0f9ad6">APRENDÉ MÚSICA A TU MANERA</p>
          <h1 class="h1">Tu <span style="color: #743c8c">camino musical</span> empieza hoy.</h1>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; align-self: flex-start">
            <button class="btn3d" type="button" onClick="{{empezarHero}}" style="font-family: Fredoka, sans-serif; font-weight: 500; font-size: clamp(18px, 1.9vw, 28px); color: #ffffff; background: #21a4de; border: 0; border-radius: 999px; padding: 0.45em 2.4em; box-shadow: 0 4px 0 #0187a8; cursor: pointer; {{bHero}}">Comenzar</button>
            <span style="font-family: Inter, system-ui, sans-serif; font-size: clamp(14px, 1.1vw, 17px); color: #3c4b57; text-align: center; line-height: 1.35">Descubrí tu nivel<br>en un minuto</span>
          </div>
        </div>
      </section>

      <section id="como-funciona" style="background: #d9effb; padding: 72px 5vw">
        <div class="leccion" style="max-width: 1280px; margin: 0 auto">
          <div style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 16px">
            <p style="margin: 0; font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: 17px; letter-spacing: 0.02em; color: #0f9ad6">PROBÁ UNA LECCIÓN</p>
            <h2 style="margin: 0; font-size: clamp(32px, 3.4vw, 48px); line-height: 1.05; font-weight: 600">¿Cómo se siente<br><span style="color: #743c8c">aprender jugando</span>?</h2>
            <p style="margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 19px; line-height: 1.45; color: #3c4b57; max-width: 400px">Tocá la nota en el momento justo y descubrí lo divertido que puede ser aprender guitarra.</p>
            <a class="btn3d" onClick="{{demo}}" href="../" style="align-self: flex-start; text-decoration: none; font-weight: 500; font-size: 24px; color: #ffffff; background: #743c8c; border-radius: 999px; padding: 12px 40px; box-shadow: 0 4px 0 #4e2660; {{bDemo}}">Probar demo</a>
          </div>
          <div style="flex: 3 1 520px; display: flex; align-items: center; gap: 2%; min-width: 0">
            <img src="img/tel-practica.webp" alt="Práctica de Hotel California en la app" style="width: 66%; height: auto">
            <img src="img/tel-camino.webp" alt="Pantalla Mi Camino de la app" style="width: 30%; height: auto">
          </div>
        </div>
      </section>
    </div>
  </sc-if>

      <section style="background: #3fb4ec; padding: 64px 5vw 70px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px">
        <p style="margin: 0; font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 0.08em; color: #ffffff">MUNDOS</p>
        <h1 style="margin: 0; font-size: clamp(36px, 4vw, 56px); font-weight: 600; color: #ffffff; line-height: 1.05">Cada mundo, un nuevo desafío</h1>
        <p style="margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 19px; color: #ffffff; max-width: 620px; line-height: 1.45">Explorá nuevos conceptos, practicá y llevá tu música al siguiente nivel.</p>
      </section>
      <sc-for list="{{mundos}}" as="m" hint-placeholder-count="4">
        <section style="{{m.fondo}}" data-mundo="{{m.idx}}">
          <div class="{{m.clase}}">
            <div class="mundo-img" style="{{m.aura}}">
              <img class="flota" src="{{m.img}}" alt="{{m.alt}}" style="{{m.imgStyle}}">
            </div>
            <div class="mundo-txt" style="{{m.txtStyle}}">
              <span style="{{m.chip}}">{{m.etiqueta}}</span>
              <h2 style="margin: 0; font-size: clamp(30px, 3vw, 42px); font-weight: 600; line-height: 1.1; color: #1d1e1c">{{m.titulo}}</h2>
              <p style="margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 17px; line-height: 1.5; color: #3c4b57; max-width: 560px">{{m.texto}}</p>
              <p style="margin: 10px 0 0; font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.08em; color: #6b6b75">{{m.nivelesLabel}}</p>
              <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
                <sc-for list="{{m.niveles}}" as="n" hint-placeholder-count="4">
                  <li style="{{n.li}}">
                    <span style="{{n.num}}">{{n.i}}</span>
                    <span style="display: flex; flex-direction: column; min-width: 0">
                      <span style="font-family: Fredoka, sans-serif; font-weight: 500; font-size: 17px; color: #1d1e1c">{{n.nombre}}</span>
                      <span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #6b6b75">{{n.tipo}}</span>
                    </span>
                  </li>
                </sc-for>
              </ol>
            </div>
          </div>
        </section>
      </sc-for>
      <section style="background: #743c8c; padding: 72px 5vw; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center">

        <button class="btn3d" type="button" onClick="{{empezarMundos}}" style="font-family: Fredoka, sans-serif; font-size: 20px; font-weight: 600; color: #ffffff; background: #96c236; border: 0; border-radius: 999px; padding: 14px 36px; box-shadow: 0 4px 0 #6f9424; cursor: pointer; {{bMundos}}">Hacé el test de nivel</button>

          </div>

                    <sc-if value="{{o.esPh}}" hint-placeholder-val="{{ false }}"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; color: #8a8792">*Ilustraciones*</span></sc-if>
                  </div>
                  <span style="font-weight: 600; font-size: 16px; line-height: 1.2; color: #1d1e1c">{{o.t}}</span>
                </button>
              </sc-for>
            </div>
            <div style="display: flex; align-items: center; justify-content: flex-end">
                <button class="btn3d" type="button" onClick="{{siguiente}}" style="display: flex; align-items: center; gap: 14px; font-family: Fredoka, sans-serif; font-size: 18px; font-weight: 600; color: #ffffff; background: #96c236; border: 0; border-radius: 999px; padding: 8px 8px 8px 30px; box-shadow: 0 4px 0 #6f9424; cursor: pointer; {{bSig}}">
                  Siguiente
                  <span style="width: 34px; height: 34px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#6f9424" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 6l6 6-6 6"></path><path d="M13 6l6 6-6 6"></path></svg></span>
                </button>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{enAnalisis}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 22px">
            <h1 style="margin: 0; font-size: clamp(28px, 3.2vw, 40px); font-weight: 600; text-align: center">Analizando tus respuestas...</h1>
            <div style="display: flex; align-items: center; gap: 14px; width: 100%; max-width: 460px">
              <div style="flex: 1; height: 16px; border-radius: 8px; background: #ece7f0; overflow: hidden"><div style="{{barraStyle}}"></div></div>
              <span style="font-weight: 600; font-size: 18px; min-width: 48px; text-align: right">{{pctLabel}}</span>
            </div>
            <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; text-align: left; width: 100%; max-width: 460px">
              <sc-for list="{{checks}}" as="c" hint-placeholder-count="4">
                <li style="display: flex; align-items: center; gap: 12px">
                  <span style="{{c.dot}}">
                    <sc-if value="{{c.hecho}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
                  </span>
                  <span style="{{c.txt}}">{{c.t}}</span>
                </li>
              </sc-for>
            </ul>
            <button class="btn3d" type="button" style="align-self: flex-end; font-family: Fredoka, sans-serif; font-size: 18px; font-weight: 600; color: #ffffff; background: #96c236; border: 0; border-radius: 999px; padding: 11px 34px; box-shadow: 0 4px 0 #6f9424; cursor: pointer">Completado</button>
          </div>
        </sc-if>
      </div>
    </section>
  </sc-if>


</div>
</template>
